<!DOCTYPE html>
<html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mini Brawl Arena</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#152331;color:#fff;font-family:system-ui,Arial;overflow:hidden}.wrap{height:100vh;display:grid;place-items:center;padding:12px}.game{width:min(100%,1000px)}header{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:8px;flex-wrap:wrap}.logo{font-weight:1000;font-size:clamp(20px,4vw,34px);color:#ffd34f;text-shadow:2px 3px #784c20}.stat{background:#263b4e;border-radius:12px;padding:8px 14px;font-weight:800}canvas{width:100%;height:auto;display:block;border:4px solid #0b1118;border-radius:16px;background:#79bd4a;touch-action:none;box-shadow:0 18px 55px #0008}.bottom{display:flex;justify-content:space-between;gap:8px;align-items:center;flex-wrap:wrap;margin-top:8px;color:#c5d4df;font-size:13px}button{border:0;border-radius:12px;padding:10px 16px;font-weight:900;background:#ffd34f;color:#3b2911;cursor:pointer}.overlay{position:fixed;inset:0;display:grid;place-items:center;background:#091521d9;padding:16px}.box{max-width:500px;background:#23394b;border:3px solid #f5ca48;border-radius:20px;padding:26px;text-align:center;box-shadow:0 16px 50px #0008}.box h1{font-size:40px;color:#ffd34f;margin:0 0 8px}.box p{line-height:1.6;color:#e3edf3}.hide{display:none}@media(max-width:600px){.wrap{padding:5px}.bottom{font-size:11px}.stat{padding:6px 9px}}
</style></head><body><div class="wrap"><div class="game"><header><div class="logo">⭐ MINI BRAWL ARENA</div><div class="stat" id="alive">생존 6</div><div class="stat" id="hp">❤️ 100</div><div class="stat" id="score">🏆 0</div></header><canvas id="c" width="960" height="600"></canvas><div class="bottom"><span>이동: WASD / 방향키 · 공격: 마우스 클릭 · 자동 조준: Space · 풀숲에서 숨기</span><button id="restart">다시 시작</button></div></div></div>
<div class="overlay" id="intro"><div class="box"><h1>MINI BRAWL</h1><p>작은 아레나에서 상대 봇들과 싸워 살아남아봐!<br>WASD로 이동하고 마우스 클릭으로 공격.<br>스페이스를 누르면 가까운 적을 자동 조준해 공격해.</p><button id="start">전투 시작!</button></div></div>
<div class="overlay hide" id="end"><div class="box"><h1 id="endtitle">게임 종료</h1><p id="endmsg"></p><button id="playagain">다시 플레이</button></div></div>
<script>
const canvas=document.getElementById('c'),ctx=canvas.getContext('2d'),W=960,H=600;let keys={},mouse={x:500,y:300},player,bots,shots,score,active,autoAim=false,frameNo=0;
const walls=[{x:190,y:100,w:100,h:65},{x:670,y:95,w:100,h:70},{x:400,y:235,w:160,h:85},{x:170,y:420,w:130,h:75},{x:675,y:420,w:115,h:75},{x:440,y:75,w:80,h:55}];
const bushes=[{x:70,y:170,w:110,h:85},{x:770,y:180,w:125,h:90},{x:340,y:450,w:115,h:95},{x:510,y:105,w:90,h:70},{x:800,y:500,w:90,h:60}];
function spawn(){return{x:Math.random()*850+55,y:Math.random()*500+50,hp:100,rad:16,spd:1.5+Math.random()*.4,cd:0,color:['#f05c52','#a85de5','#ff8b35','#49a8ec','#e95bb1'][Math.floor(Math.random()*5)],alive:true}}
function reset(){player={x:480,y:300,hp:100,rad:18,spd:3.3,cd:0,alive:true};bots=Array.from({length:5},spawn);shots=[];score=0;active=true;frameNo=0;document.getElementById('intro').classList.add('hide');document.getElementById('end').classList.add('hide');loop()}
function circleRect(x,y,r,b){let nx=Math.max(b.x,Math.min(x,b.x+b.w)),ny=Math.max(b.y,Math.min(y,b.y+b.h));return (x-nx)**2+(y-ny)**2<r*r}
function move(ent,dx,dy){let nx=ent.x+dx,ny=ent.y+dy;if(nx<ent.rad||nx>W-ent.rad)dx=0;if(ny<ent.rad||ny>H-ent.rad)dy=0;nx=ent.x+dx;ny=ent.y+dy;if(!walls.some(b=>circleRect(nx,ny,ent.rad,b))){ent.x=nx;ent.y=ny}else{if(!walls.some(b=>circleRect(nx,ent.y,ent.rad,b)))ent.x=nx;if(!walls.some(b=>circleRect(ent.x,ny,ent.rad,b)))ent.y=ny}}
function fire(from,to,owner){let dx=to.x-from.x,dy=to.y-from.y,l=Math.hypot(dx,dy)||1;shots.push({x:from.x,y:from.y,vx:dx/l*7.5,vy:dy/l*7.5,life:75,owner,damage:22})}
function insideBush(ent){return bushes.some(b=>ent.x>b.x&&ent.x<b.x+b.w&&ent.y>b.y&&ent.y<b.y+b.h)}
function nearestTarget(from){return bots.filter(b=>b.alive).sort((a,b)=>Math.hypot(a.x-from.x,a.y-from.y)-Math.hypot(b.x-from.x,b.y-from.y))[0]}
function update(){if(!active)return;frameNo++;let dx=(keys.d||keys.arrowright?1:0)-(keys.a||keys.arrowleft?1:0),dy=(keys.s||keys.arrowdown?1:0)-(keys.w||keys.arrowup?1:0),l=Math.hypot(dx,dy)||1;move(player,dx/l*player.spd,dy/l*player.spd);
player.cd=Math.max(0,player.cd-1);if((keys[' ']||mouse.down)&&player.cd===0){let target=keys[' ']?nearestTarget(player):mouse; if(target){fire(player,target,'player');player.cd=16;keys[' ']=false;mouse.down=false}}
bots.forEach(bot=>{if(!bot.alive)return;bot.cd=Math.max(0,bot.cd-1);let target=player,dist=Math.hypot(player.x-bot.x,player.y-bot.y);if(dist>330){let wander=frameNo/50+bot.x;move(bot,Math.cos(wander)*bot.spd*.5,Math.sin(wander)*bot.spd*.5)}else{let vx=(target.x-bot.x)/(dist||1),vy=(target.y-bot.y)/(dist||1);move(bot,vx*bot.spd,vy*bot.spd);if(dist<300&&bot.cd===0){fire(bot,target,'bot');bot.cd=50+Math.random()*25}}});
shots.forEach(s=>{s.x+=s.vx;s.y+=s.vy;s.life--;if(s.x<0||s.x>W||s.y<0||s.y>H||walls.some(w=>circleRect(s.x,s.y,5,w)))s.life=0;if(s.owner==='player'){bots.forEach(b=>{if(b.alive&&Math.hypot(s.x-b.x,s.y-b.y)<b.rad+5){b.hp-=s.damage;s.life=0;if(b.hp<=0){b.alive=false;score++}}})}else if(Math.hypot(s.x-player.x,s.y-player.y)<player.rad+5){player.hp-=s.damage;s.life=0;if(player.hp<=0){player.alive=false;finish(false)}}});shots=shots.filter(s=>s.life>0);
if(bots.every(b=>!b.alive))finish(true);
document.getElementById('hp').textContent='❤️ '+Math.max(0,Math.round(player.hp));document.getElementById('score').textContent='🏆 '+score;document.getElementById('alive').textContent='생존 '+(bots.filter(b=>b.alive).length+ (player.alive?1:0))}
function finish(win){if(!active)return;active=false;document.getElementById('endtitle').textContent=win?'🏆 승리!':'💥 게임 종료';document.getElementById('endmsg').textContent=win?'모든 상대를 이겼어!':'처치 '+score+'명 · 다시 도전해봐!';document.getElementById('end').classList.remove('hide')}
function draw(){ctx.clearRect(0,0,W,H);ctx.fillStyle='#76bd48';ctx.fillRect(0,0,W,H);for(let i=0;i<24;i++){ctx.fillStyle=i%2?'#7bc650':'#70b944';ctx.fillRect(i*40,0,40,H)}// scattered ground marks
for(let i=0;i<120;i++){let x=(i*71)%W,y=(i*97)%H;ctx.fillStyle='#4d9e37';ctx.globalAlpha=.17;ctx.fillRect(x,y,3,4)}ctx.globalAlpha=1;
walls.forEach(w=>{ctx.fillStyle='#9b6a42';ctx.fillRect(w.x,w.y,w.w,w.h);ctx.fillStyle='#b98451';ctx.fillRect(w.x+5,w.y+5,w.w-10,w.h-10);ctx.strokeStyle='#704a2d';ctx.lineWidth=3;ctx.strokeRect(w.x,w.y,w.w,w.h)});
bushes.forEach(b=>{ctx.fillStyle='#277f3a';ctx.beginPath();ctx.roundRect(b.x,b.y,b.w,b.h,22);ctx.fill();for(let j=0;j<12;j++){ctx.fillStyle=j%2?'#369b45':'#4aaf50';ctx.beginPath();ctx.arc(b.x+Math.random()*b.w,b.y+Math.random()*b.h,10,0,Math.PI*2);ctx.fill()}});
function drawChar(e,col,label){ctx.fillStyle='#0003';ctx.beginPath();ctx.ellipse(e.x,e.y+12,e.rad+2,8,0,0,Math.PI*2);ctx.fill();ctx.fillStyle=col;ctx.beginPath();ctx.arc(e.x,e.y,e.rad,0,Math.PI*2);ctx.fill();ctx.strokeStyle='#263543';ctx.lineWidth=3;ctx.stroke();ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(e.x-5,e.y-3,4,0,Math.PI*2);ctx.arc(e.x+5,e.y-3,4,0,Math.PI*2);ctx.fill();ctx.fillStyle='#28303b';ctx.beginPath();ctx.arc(e.x-5,e.y-3,2,0,Math.PI*2);ctx.arc(e.x+5,e.y-3,2,0,Math.PI*2);ctx.fill();ctx.fillStyle='#222';ctx.fillRect(e.x-22,e.y-31,44,6);ctx.fillStyle='#42e66b';ctx.fillRect(e.x-22,e.y-31,44*Math.max(0,e.hp/100),6);ctx.fillStyle='#fff';ctx.font='bold 11px system-ui';ctx.textAlign='center';ctx.fillText(label,e.x,e.y-36)}
bots.forEach(b=>{if(b.alive)drawChar(b,b.color,'BOT')});drawChar(player,'#ffd34f','YOU');shots.forEach(s=>{ctx.fillStyle=s.owner==='player'?'#ffe870':'#fff3ef';ctx.beginPath();ctx.arc(s.x,s.y,6,0,Math.PI*2);ctx.fill();ctx.strokeStyle='#333';ctx.stroke()});
// foliage overlay keeps player hidden
bushes.forEach(b=>{if(insideBush(player)){ctx.fillStyle='#208039bb';ctx.beginPath();ctx.roundRect(b.x,b.y,b.w,b.h,22);ctx.fill();for(let j=0;j<16;j++){ctx.fillStyle='#3d9c48';ctx.beginPath();ctx.arc(b.x+((j*37)%b.w),b.y+((j*29)%b.h),13,0,Math.PI*2);ctx.fill()}}});
}
function loop(){if(!active)return;update();draw();requestAnimationFrame(loop)}
window.addEventListener('keydown',e=>{keys[e.key.toLowerCase()]=true;if([' ','arrowup','arrowdown','arrowleft','arrowright'].includes(e.key.toLowerCase()))e.preventDefault()});window.addEventListener('keyup',e=>keys[e.key.toLowerCase()]=false);canvas.addEventListener('pointermove',e=>{let r=canvas.getBoundingClientRect();mouse.x=(e.clientX-r.left)*W/r.width;mouse.y=(e.clientY-r.top)*H/r.height});canvas.addEventListener('pointerdown',e=>{mouse.down=true;let r=canvas.getBoundingClientRect();mouse.x=(e.clientX-r.left)*W/r.width;mouse.y=(e.clientY-r.top)*H/r.height});window.addEventListener('pointerup',()=>mouse.down=false);
document.getElementById('start').onclick=reset;document.getElementById('restart').onclick=reset;document.getElementById('playagain').onclick=reset;
draw();
</script></body></html>
